name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  migrations:
    name: alembic (apply / revert / re-apply)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: limbitless
          POSTGRES_PASSWORD: limbitless
          POSTGRES_DB: limbitless
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://limbitless:limbitless@localhost:5432/limbitless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply migrations, check for model drift, then revert and re-apply
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
